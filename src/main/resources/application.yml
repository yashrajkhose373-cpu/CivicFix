spring:
  application:
    name: studysync

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/studysync_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080

logging:
  level:
    com.studysync: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: ERROR
